<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Favicons (early in head so tab icon shows immediately) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />

    <!-- PRIMARY META -->
    <title>Free Markdown Editor & Preview | Write Markdown Online</title>
    <meta name="description" content="Write and preview Markdown in real-time with GitHub Flavored Markdown support. Tables, code blocks, checklists. Export to HTML. 100% free, no signup." />
    <meta name="keywords" content="markdown editor, markdown preview, markdown online, markdown to html, markdown editor online, github markdown, gfm editor, markdown viewer" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://free-markdown-editor.codama.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free Markdown Editor & Preview | Write Markdown Online" />
    <meta property="og:description" content="Write and preview Markdown in real-time with GitHub Flavored Markdown support. Tables, code blocks, checklists. Export to HTML. 100% free, no signup." />
    <meta property="og:url" content="https://free-markdown-editor.codama.dev/" />
    <meta property="og:site_name" content="Free Markdown Editor & Preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Markdown Editor & Preview | Write Markdown Online" />
    <meta name="twitter:description" content="Write and preview Markdown in real-time with GitHub Flavored Markdown support. Tables, code blocks, checklists. Export to HTML. 100% free, no signup." />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Free Markdown Editor & Preview",
        "description": "Write and preview Markdown in real-time with GitHub Flavored Markdown support. Tables, code blocks, checklists. Export to HTML. 100% free, no signup.",
        "url": "https://free-markdown-editor.codama.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Real-time Markdown preview",
          "GitHub Flavored Markdown (tables, checklists, code blocks)",
          "Syntax highlighting in code blocks",
          "Export to HTML",
          "No registration, no limits, works in browser"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
